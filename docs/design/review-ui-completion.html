<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>วางเดี๋ยวนี้! · ตรวจแบบรอบใหม่</title><style>
@font-face{font-family:Pid;src:url(../../app/src/main/res/font/pid_noto_sans_thai.ttf)}*{box-sizing:border-box}body{margin:0;background:#f0ece9;color:#252033;font:14px/1.65 Pid,sans-serif}header{background:#fff8f3;border-bottom:1px solid #d8cbd0;padding:22px max(20px,calc((100vw - 1120px)/2));}h1{font-size:24px;line-height:1.4;margin:0 0 5px}p{margin:0;color:#6b5d6a}.status{display:inline-block;padding:4px 10px;border-radius:8px;color:#3442aa;background:#e9e9ff;font-size:12px;margin-top:10px}main{max-width:1120px;margin:auto;padding:24px 20px;display:grid;grid-template-columns:280px 1fr;gap:32px}aside{align-self:start;position:sticky;top:20px}.label{font-size:12px;color:#6b5d6a;display:block;margin:20px 0 6px}nav{display:grid;gap:8px}button,select,a{font:inherit}button,select{min-height:48px;border:1px solid #d8cbd0;border-radius:12px;color:#252033;background:#fffdf9;padding:10px 12px}button{cursor:pointer}nav button{text-align:left}button[aria-pressed=true]{border-color:#3442aa;color:#3442aa;background:#e9e9ff;font-weight:600}select{width:100%}.themes{display:flex;gap:8px}.themes button{flex:1}.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.links a{color:#3442aa;text-underline-offset:3px}.preview{margin:0;text-align:center}figcaption{font-size:13px;color:#6b5d6a;margin:0 0 14px}.preview img{display:block;width:390px;max-width:100%;height:auto;margin:auto;border-radius:24px;box-shadow:0 12px 35px #25203315}.preview a{display:block}.note{font-size:12px;color:#6b5d6a;margin-top:16px}.preview img.tablet{width:600px}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #3442aa;outline-offset:3px}@media(max-width:720px){main{grid-template-columns:1fr;gap:22px}aside{position:static}nav{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}nav button{font-size:13px;padding:10px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.controls .themes{grid-column:1/-1}.links{margin-top:16px}header{padding:18px 20px}h1{font-size:22px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s ease,border-color .15s ease}}
</style></head><body><header><h1>วางเดี๋ยวนี้! · ตรวจแบบรอบใหม่</h1><p>ภาพจาก Android หลังปรับ UI และต้นแบบสำหรับกดทดลอง</p><span class="status">งาน UI รอบใหม่ · ส่งต่อบน feature/13-ui-polish</span></header><main><aside><nav aria-label="ส่วนที่ออกแบบใหม่"><button data-group="persona" aria-pressed="true">บุคลิกและคำด่า</button><button data-group="monitor">สถานะการตรวจจับ</button><button data-group="focus">โฟกัสและตัวจับเวลา</button><button data-group="reminder">การแจ้งเตือน</button><button data-group="history">ประวัติ / สถิติ · แบบส่งต่อ</button></nav><div class="controls"><div><label class="label" for="state">สถานะที่ต้องการตรวจ</label><select id="state"></select></div><div><label class="label" for="device">ขนาดจอ</label><select id="device"><option value="phone390">มือถือ 390dp</option><option value="tablet800">แท็บเล็ต 800dp</option><option value="compact360">จอเล็ก · ตัวอักษร 130%</option></select></div><div class="themes" style="margin-top:16px"><button data-theme="day" aria-pressed="true">สว่าง</button><button data-theme="night" aria-pressed="false">มืด</button></div></div><p class="note" id="notes"></p><div class="links"><a href="remaining-screens.html" target="_blank">เปิดต้นแบบกดได้</a><a href="REMAINING-UI-REVIEW.md">รายละเอียดงานรอบนี้</a></div></aside><figure class="preview"><figcaption id="caption"></figcaption><a id="full-image" target="_blank"><img id="preview" alt="ภาพหน้าจอสำหรับตรวจแบบ"></a></figure></main><script>
(()=>{const groups={persona:[['persona','เลือกสไตล์การเตือน'],['persona-selected','เปลี่ยนบุคลิก'],['persona-empty','ช่องเพิ่มข้อความและสถานะว่าง'],['persona-error','กรอกข้อความว่าง'],['persona-added','เพิ่มข้อความสำเร็จ'],['persona-remove-confirm','ยืนยันก่อนนำออก']],monitor:[['monitor-permission','สิทธิ์ยังไม่ครบ'],['monitor-stopped','การตรวจจับหยุด'],['monitor-ready','พร้อมทำงาน · ซ่อนแถบเตือน']],focus:[['focus-error','กรอกเวลาไม่ถูกต้อง'],['focus-hours','499:53 → 8:19:53'],['focus-long-hours','16:39:59 · เวลายาว'],['focus-success','โฟกัสสำเร็จ']],reminder:[['reminder-level-1','ตัวอย่างระดับ 1'],['reminder-level-2','ตัวอย่างระดับ 2'],['reminder-level-3','ตัวอย่างระดับ 3'],['android-notification','แจ้งเตือน Android จริง']],history:[['history','ประวัติและกราฟ 7 วัน'],['history-empty','ไม่มีประวัติ']]};let group='persona',theme='day';const state=document.getElementById('state'),device=document.getElementById('device'),img=document.getElementById('preview');function render(){document.querySelectorAll('[data-group]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.group===group));document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===theme));let prefix=device.value==='compact360'?'compact360-large-text':device.value+'-'+theme;let source=group==='history'?'screens/remaining/'+state.value+'-'+(state.value==='history-empty'?'day':theme)+'.png':'../evidence/ui-completion/'+prefix+'-'+state.value+'.png';img.src=source;img.classList.toggle('tablet',device.value==='tablet800'&&group!=='history');document.getElementById('full-image').href=source;document.getElementById('caption').textContent=state.selectedOptions[0].textContent+' · '+(group==='history'?'แบบส่งต่อฟีเจอร์เสริม':device.selectedOptions[0].textContent+' · '+(device.value==='compact360'?'สว่าง / English':theme==='day'?'สว่าง / ไทย':'มืด'))+' · แตะภาพเพื่อดูขนาดเต็ม';document.getElementById('notes').textContent=group==='history'?'ประวัติและสถิติเป็นแบบส่งต่อ #10 ยังไม่ได้เพิ่มระบบบันทึกหรือหน้าประวัติในแอปจริง':group==='monitor'?'เตรียมสถานะแสดงผลและปุ่มไว้แล้ว ทีมคุมแอปเป็นผู้ส่งสถานะจริงและเชื่อมคำสั่งเปิดการตรวจจับ':group==='reminder'?'หน้าตาการ์ด Android จริงขึ้นกับเครื่องและเวอร์ชันระบบ รอบนี้เปลี่ยนไอคอนและสีแบรนด์ โดยคงเงื่อนไขและเสียงเดิม':'ภาพจาก Android Emulator ทั้งสองธีม มีภาพช่องกรอก รายการ และ dialog แยกให้ตรวจ';device.disabled=group==='history'}function choose(name){group=name;state.innerHTML=groups[group].map(([value,label])=>'<option value="'+value+'">'+label+'</option>').join('');render()}document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>choose(b.dataset.group));document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;render()});state.onchange=render;device.onchange=render;choose('persona')})();
</script></body></html>
