<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>วางเดี๋ยวนี้! · ตรวจ Android หลังแก้ 5 ประเด็น</title><style>
@font-face{font-family:Pid;src:url(../../app/src/main/res/font/pid_noto_sans_thai.ttf)}*{box-sizing:border-box}body{margin:0;background:#f0ece9;color:#252033;font:14px/1.65 Pid,sans-serif}header{background:#fff8f3;border-bottom:1px solid #d8cbd0;padding:22px max(20px,calc((100vw - 1120px)/2));}h1{font-size:24px;line-height:1.4;margin:0 0 5px}p{margin:0;color:#6b5d6a}.status{display:inline-block;padding:4px 10px;border-radius:8px;color:#3442aa;background:#e9e9ff;font-size:12px;margin-top:10px}main{max-width:1120px;margin:auto;padding:24px 20px;display:grid;grid-template-columns:280px 1fr;gap:32px}aside{align-self:start;position:sticky;top:20px}.label{font-size:12px;color:#6b5d6a;display:block;margin:20px 0 6px}nav{display:grid;gap:8px}button,select,a{font:inherit}button,select{min-height:48px;border:1px solid #d8cbd0;border-radius:12px;color:#252033;background:#fffdf9;padding:10px 12px}button{cursor:pointer}nav button{text-align:left}button[aria-pressed=true]{border-color:#3442aa;color:#3442aa;background:#e9e9ff;font-weight:600}select{width:100%}.themes{display:flex;gap:8px}.themes button{flex:1}.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.links a{color:#3442aa;text-underline-offset:3px}.preview{margin:0;text-align:center}figcaption{font-size:13px;color:#6b5d6a;margin:0 0 14px}.preview img{display:block;width:390px;max-width:100%;height:auto;margin:auto;border-radius:24px;box-shadow:0 12px 35px #25203315}.preview a{display:block}.note{font-size:12px;color:#6b5d6a;margin-top:16px}.preview img.tablet{width:600px}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #3442aa;outline-offset:3px}@media(max-width:720px){main{grid-template-columns:1fr;gap:22px}aside{position:static}nav{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}nav button{font-size:13px;padding:10px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.controls .themes{grid-column:1/-1}.links{margin-top:16px}header{padding:18px 20px}h1{font-size:22px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s ease,border-color .15s ease}}
</style></head><body><p style="padding:16px;background:#fff8f3;color:#252033">ภาพย้อนหลัง: เจ้าของงานเลือกหน้าหลักแบบเก่าและหน้าที่เหลือแบบใหม่แล้ว · <a href="final-approved.html">ดู Android รุ่นส่งมอบ</a> · <a href="playable-app.html?screen=home">กดเล่นแบบปัจจุบัน</a></p><header><h1>วางเดี๋ยวนี้! · ตรวจ Android หลังแก้ 5 ประเด็น</h1><p>ภาพจากแอป Java/XML จริงหลังแก้ พร้อมต้นแบบสำหรับกดทดลอง</p><span class="status">งานแก้ในเครื่อง · ยังไม่ commit / push</span></header><main><aside><nav aria-label="ส่วนที่ออกแบบใหม่"><button data-group="persona" aria-pressed="true">สไตล์การเตือนในตั้งค่า</button><button data-group="monitor">สถานะการตรวจจับ</button><button data-group="focus">หน้าหลักและลำดับเนื้อหา</button><button data-group="reminder">การแจ้งเตือน</button><button data-group="history">สถิติและค่ารายวัน</button></nav><div class="controls"><div><label class="label" for="state">สถานะที่ต้องการตรวจ</label><select id="state"></select></div><div><label class="label" for="device">ขนาดจอ</label><select id="device"><option value="phone390">มือถือ 390dp</option><option value="tablet800">แท็บเล็ต 800dp</option><option value="compact360">จอเล็ก · ตัวอักษร 130%</option></select></div><div class="themes" style="margin-top:16px"><button data-theme="day" aria-pressed="true">สว่าง</button><button data-theme="night" aria-pressed="false">มืด</button></div></div><p class="note" id="notes"></p><div class="links"><a href="playable-app.html" target="_blank">เปิดต้นแบบกดได้</a><a href="REVIEW-FIXES.md">รายละเอียดงานรอบนี้</a></div></aside><figure class="preview"><figcaption id="caption"></figcaption><a id="full-image" target="_blank"><img id="preview" alt="ภาพหน้าจอสำหรับตรวจแบบ"></a></figure></main><script>
(()=>{const groups={persona:[['settings-persona','ตั้งค่า · สไตล์ที่เลือก']],monitor:[['monitor-starting','กำลังเริ่ม · ปุ่มรอ'],['monitor-failed','เริ่มไม่ได้ · ลองใหม่/ตรวจสิทธิ์'],['monitor-retry-success','ลองใหม่สำเร็จ · ซ่อนแถบเตือน']],focus:[['home-priorities','หน้าหลัก · แอปที่คุมมาก่อน'],['home-summary','สรุปวันนี้และโฟกัสรอง'],['home-live','หน้าหลัก · ข้อมูลจริง']],reminder:[['notification-1','Android ระดับ 1'],['notification-2','Android ระดับ 2'],['notification-3','Android ระดับ 3']],history:[['history-partial','มีข้อมูล 5 จาก 7 วัน'],['history-daily-values','ค่ารายวันและข้อมูลไม่ครบ'],['history-no_apps','ยังไม่มีแอปที่คุม'],['history-permission_required','ไม่มีสิทธิ์ดูการใช้งาน'],['history-unavailable','อ่านข้อมูลไม่ได้ / ลองใหม่'],['history-live','ประวัติ · ข้อมูลจริง'],['history-filled','ประวัติหลังส่งเตือน'],['history-clear-confirm','ยืนยันล้างประวัติ']]};let group='persona',theme='day';const state=document.getElementById('state'),device=document.getElementById('device'),img=document.getElementById('preview');function render(){document.querySelectorAll('[data-group]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.group===group));document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===theme));let prefix=device.value==='compact360'?'compact360-large-text':device.value+'-'+theme;let source='../evidence/review-fixes/'+prefix+'-'+state.value+'.png';img.src=source;img.classList.toggle('tablet',device.value==='tablet800');document.getElementById('full-image').href=source;document.getElementById('caption').textContent=state.selectedOptions[0].textContent+' · '+(device.selectedOptions[0].textContent+' · '+(device.value==='compact360'?'สว่าง / English':theme==='day'?'สว่าง / ไทย':'มืด'))+' · แตะภาพเพื่อดูขนาดเต็ม';document.getElementById('notes').textContent='ภาพ Android จริง · บางสถานะใส่ข้อมูลตัวอย่างเฉพาะ debug เพื่อให้ตรวจได้ รวมภาพข้อมูลจริงและ notification ระบบ โดยไม่เล่นเสียง';device.disabled=false}function choose(name){group=name;state.innerHTML=groups[group].map(([value,label])=>'<option value="'+value+'">'+label+'</option>').join('');render()}document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>choose(b.dataset.group));document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;render()});state.onchange=render;device.onchange=render;choose('persona')})();
</script></body></html>
